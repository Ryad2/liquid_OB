name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: High-precision oracle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Test independent reference model
        run: python -m unittest tools.reference.test_reference_math -v

      - name: Verify committed vectors are current
        run: python -m tools.reference.generate_vectors --check

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
          cache: true

      - name: Check formatting
        run: forge fmt --root contracts --check

      - name: Run linter
        run: forge lint --root contracts

      - name: Build contracts
        run: forge build --root contracts --sizes

      - name: Check Subgraph ABIs
        run: node subgraph/scripts/sync-abis.mjs --check

      - name: Check generated ABIs
        run: node packages/contracts/scripts/generate-abis.mjs --check

      - name: Run contract tests
        # Force recompilation so a preceding build cannot leave test discovery
        # dependent on Foundry's artifact cache.
        run: forge test --root contracts --force -vvv

  web:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check release scripts
        run: |
          node --check apps/web/server.mjs
          node --check scripts/verify-public-demo.mjs
          node --check packages/contracts/scripts/verify-deployment.mjs

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build solver API image
        run: docker build -f services/solver-api/Dockerfile -t liquid-ob-solver-api:ci .

      - name: Build liquidity MCP image
        run: docker build -f services/liquidity-mcp/Dockerfile -t liquid-ob-liquidity-mcp:ci .

      - name: Build mock web image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_PROTOCOL_MODE=mock -t liquid-ob-web:ci .
