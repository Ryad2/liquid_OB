specVersion: 1.3.0
description: ArcBook executable maker-curve discovery and route history
repository: https://github.com/Ryad2/liquid_OB
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: Aqua
    network: base-sepolia
    source:
      address: "0x340d634407567C0e41507e13Af3c5F9C2C2799f4"
      abi: Aqua
      startBlock: 44634296
    context:
      router:
        type: Bytes
        data: "0x4A98e5D8a4789b2E24E7b6E0fCf1D48C815dc421"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Token
        - Market
        - Maker
        - Position
        - CurveSide
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Docked(address,address,bytes32)
          handler: handleDocked
      file: ./src/aqua.ts
  - kind: ethereum/contract
    name: Router
    network: base-sepolia
    source:
      address: "0x4A98e5D8a4789b2E24E7b6E0fCf1D48C815dc421"
      abi: Router
      startBlock: 44634296
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Market
        - Maker
        - Position
        - CurveSide
        - Fill
        - MarketSnapshot
      abis:
        - name: Router
          file: ./abis/Router.json
      eventHandlers:
        - event: PositionRuntimeInitialized(indexed bytes32,indexed bytes32,indexed address,bytes32,uint128,uint128,uint128,uint128,uint64)
          handler: handlePositionRuntimeInitialized
        - event: CurveFilled(indexed bytes32,indexed bytes32,indexed address,bytes32,bytes32,uint16,uint8,uint8,uint8,address,address,address,address,uint256,uint256,uint128,uint128,uint128,uint128,uint128,uint128,uint128,uint128,uint128,uint128,uint64,uint128,uint128,uint128,uint128,uint64)
          handler: handleCurveFilled
      file: ./src/router.ts
  - kind: ethereum/contract
    name: BatchExecutor
    network: base-sepolia
    source:
      address: "0xf7A75d70220999F4440b58063F4dD4CE0C73658e"
      abi: BatchExecutor
      startBlock: 44634296
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Market
        - Route
        - MarketSnapshot
      abis:
        - name: BatchExecutor
          file: ./abis/BatchExecutor.json
      eventHandlers:
        - event: RouteExecuted(indexed bytes32,indexed bytes32,indexed address,address,address,uint8,uint8,address,address,uint256,uint256,uint256,uint16)
          handler: handleRouteExecuted
      file: ./src/executor.ts
