<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">ArcBook</title>
  <defs>
    <linearGradient id="surface" x1="5" y1="4" x2="59" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141b35"/>
      <stop offset=".52" stop-color="#0a0d1d"/>
      <stop offset="1" stop-color="#070914"/>
    </linearGradient>
    <linearGradient id="buy" x1="6" y1="20" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62d9ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#9ce8ff"/>
    </linearGradient>
    <linearGradient id="sell" x1="32" y1="30" x2="58" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a99dff"/>
      <stop offset="1" stop-color="#ff9a72" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#edf0ff"/>
      <stop offset=".32" stop-color="#b9b2ff"/>
      <stop offset="1" stop-color="#a99dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="2" y="2" width="60" height="60" rx="17"/>
    </clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#surface)" stroke="#a5b4e5" stroke-opacity=".3"/>
  <g clip-path="url(#frame)" fill="none" stroke="#9eafe1" stroke-opacity=".075" stroke-width=".65">
    <path d="M4 16H60M4 32H60M4 48H60"/>
    <path d="M16 4V60M32 4V60M48 4V60"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M6 35C13 19 22 12 32 30" stroke="url(#buy)" stroke-width="3"/>
    <path d="M58 35C51 19 42 12 32 30" stroke="url(#sell)" stroke-width="3"/>
    <path d="M10 27C18 17 25 20 32 30" stroke="#62d9ff" stroke-opacity=".3" stroke-width="1.3"/>
    <path d="M54 27C46 17 39 20 32 30" stroke="#ff9a72" stroke-opacity=".3" stroke-width="1.3"/>
    <path d="M16 39C22 34 27 31 32 30C37 31 42 34 48 39" stroke="#a99dff" stroke-opacity=".18" stroke-width="1"/>
  </g>
  <circle cx="32" cy="30" r="8" fill="url(#core)" opacity=".55" filter="url(#glow)"/>
  <circle cx="32" cy="30" r="2.2" fill="#edf0ff" filter="url(#glow)"/>
